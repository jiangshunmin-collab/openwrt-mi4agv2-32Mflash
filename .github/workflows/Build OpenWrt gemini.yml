name: Build OpenWrt Gemini(Mi 4A v2 - 32M)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  UPLOAD_FIRMWARE: true
  FIRMWARE_VERSION: v24.10.2

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to v24.10.2
        run: |
          git checkout tags/${{ env.FIRMWARE_VERSION }}
          echo "Checked out version: $(git describe --tags)"

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3
          sudo timedatectl set-timezone "$TZ"

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch DTS for 32M Flash (Crucial Step)
        run: |
          # 定义 DTS 路径
          DTS_FILE="target/linux/ramips/dts/mt7621_xiaomi_mi-router-4a-gigabit-v2.dts"
          
          echo "=== 修改前检查 DTS 分区定义 ==="
          grep -A 5 "label = \"firmware\"" $DTS_FILE || echo "未找到 firmware 标签"

          # 使用 sed 精准修改：
          # 1. 修改 SPI Flash 总大小定义：从 16MB (<0x0 0x1000000>) 改为 32MB (<0x0 0x2000000>)
          sed -i 's/<0x0 0x1000000>/<0x0 0x2000000>/g' $DTS_FILE

          # 2. 修改 firmware 分区大小：
          # 原理：0x1000000 (16M) - 0x180000 (u-boot偏移) = 0xE80000 (原大小)
          # 新增：0x2000000 (32M) - 0x180000 (u-boot偏移) = 0x1E80000 (新大小)
          # 我们查找 0xe80000 并替换为 0x1e80000
          sed -i 's/0xe80000/0x1e80000/g' $DTS_FILE

          echo "=== 修改后检查 DTS 分区定义 ==="
          grep -A 5 "label = \"firmware\"" $DTS_FILE

      - name: Configure Firmware (Force 32M & Chinese)
        run: |
          # 1. 基础机型配置
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-4a-gigabit-v2=y" >> .config

          # 2. 强制开启 LuCI 和 中文 (使用 append 模式防止被覆盖)
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-mod-admin-full=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-hans=y" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config

          # 3. 调整 Rootfs 大小 (配合 32M Flash)
          # 设置为 28MB，留 4MB 给内核和其他分区，确保安全
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=28" >> .config

          # 4. 生成配置并检查
          make defconfig
          
          echo "=== 检查中文包是否被选中 ==="
          grep "CONFIG_PACKAGE_luci-i18n-base-zh-hans" .config || echo "警告：中文包未被选中！"

      - name: Download Packages
        run: make download -j8

      - name: Compile Firmware
        run: |
          echo "Starting compilation..."
          make -j$(nproc) || make -j1 V=s

      - name: Organize Files
        run: |
          mkdir -p ./artifact/
          # 查找 sysupgrade.bin 文件
          find bin/targets/ramips/mt7621/ -name "*sysupgrade.bin" | xargs -i mv {} ./artifact/
          echo "FIRMWARE_PATH=$PWD/artifact" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi4A_v2_32M_Firmware
          path: ${{ env.FIRMWARE_PATH }}

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.FIRMWARE_VERSION }}-${{ github.run_id }}
          name: OpenWrt 24.10.2 - Mi4A v2 (32M Special)
          body: |
            ## 32M 专版说明
            - **内核分区表已修改**：真正支持 32M Flash 寻址
            - **RootFS 大小**：已扩容至 28MB (可用空间应 >20MB)
            - **默认语言**：简体中文
            - **刷机提示**：Breed 中刷入时，请确保 Breed 能识别到 32M Flash。
          files: ${{ env.FIRMWARE_PATH }}/*
