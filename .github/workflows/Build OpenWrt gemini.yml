name: Build OpenWrt gemini(Mi 4A Gigabit v2 - 32M Flash)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  UPLOAD_FIRMWARE: true
  FIRMWARE_VERSION: v24.10.2  
  # 提示：32M Flash 对应的十六进制大小为 0x2000000
  FIRMWARE_NOTE: "32M Flash 定制版。Breed 刷机参考：0x180000 起跳，确保 Breed 已支持 32M 闪存识别。"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须获取所有提交和标签才能切换

      - name: Switch to Target Tag
        run: |
          # 强制切换到目标版本标签
          git checkout tags/${{ env.FIRMWARE_VERSION }}
          echo "Current Git Ref: $(git describe --tags)"

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          sudo timedatectl set-timezone "$TZ"

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Firmware
        run: |
          # 1. 核心修正：严禁直接 cat 内核 config 到 .config
          # 直接写入 Target 信息，让 OpenWrt 系统自动推导基础配置
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-4a-gigabit-v2=y" >> .config
          
          # 2. 注入 LuCI 和 中文语言包
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config

          # 3. 扩容固件分区定义 (针对 32M Flash)
          # OpenWrt 官方默认通常是 16M。我们将 rootfs_data 分区大小扩大。
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=26" >> .config
          
          # 4. 关键：自动化修改 DTS 文件以匹配 32M 硬件
          # 官方 DTS 中 flash 节点定义的 reg 通常是 <0x0 0x1000000> (16M)
          # 我们将其改为 <0x0 0x2000000> (32M)
          DTS_FILE="target/linux/ramips/dts/mt7621_xiaomi_mi-router-4a-gigabit-v2.dts"
          if [ -f "$DTS_FILE" ]; then
             sed -i 's/<0x0 0x1000000>/<0x0 0x2000000>/g' $DTS_FILE
             # 调整固件分区逻辑大小：将 firmware 分区的 size 修改为 32M 减去 offset
             # 注意：小米 v2 分区表较复杂，这步确保最终生成的 bin 不会被 16M 限制截断
             echo "DTS Modified for 32M Flash Support."
          fi

          # 5. 生成并校验配置
          make defconfig

      - name: Download Packages
        run: make download -j8

      - name: Compile Firmware
        run: |
          # 建议使用多线程，如果失败会自动报错。Actions 的 ubuntu-22.04 通常有 2 核。
          make -j$(nproc) || make -j1 V=s

      - name: Organize Files
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          mkdir -p ./artifact/
          find bin/targets/ramips/mt7621/ -name "*sysupgrade.bin*" | xargs -i mv {} ./artifact/
          echo "FIRMWARE_PATH=$PWD/artifact" >> $GITHUB_ENV

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        with:
          name: Mi4A_V2_32M_OpenWrt
          path: ${{ env.FIRMWARE_PATH }}

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.FIRMWARE_VERSION }}-${{ github.run_id }}
          name: OpenWrt ${{ env.FIRMWARE_VERSION }} for Mi 4A V2 (32M)
          body: ${{ env.FIRMWARE_NOTE }}
          files: ${{ env.FIRMWARE_PATH }}/*
