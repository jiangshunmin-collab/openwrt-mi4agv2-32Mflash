name: Build Mi 4A Gigabit V2 32M L2TP Kmods

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  FIRMWARE_VERSION: v24.10.2

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to Official Tag
        run: |
          git checkout tags/${{ env.FIRMWARE_VERSION }}
          echo "Checked out: $(git describe --tags)"

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3
          sudo timedatectl set-timezone "$TZ"

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch DTS for 32M Flash (V2)
        shell: python3 {0}
        run: |
          import os
          dts_path = "target/linux/ramips/dts/mt7621_xiaomi_mi-router-4a-gigabit-v2.dts"
          if not os.path.exists(dts_path):
              print(f"Error: {dts_path} not found!")
              exit(1)
          with open(dts_path, 'r') as f:
              content = f.read()
          content = content.replace("<0x0 0x1000000>", "<0x0 0x2000000>")
          override_node = """
          &partitions {
              partition@180000 {
                  label = "firmware";
                  reg = <0x180000 0x1e70000>;
              };
              partition@1ff0000 {
                  label = "Config";
                  reg = <0x1ff0000 0x10000>;
                  read-only;
              };
          };
          """
          with open(dts_path, 'w') as f:
              f.write(content + "\n" + override_node)

      - name: Configure Firmware
        run: |
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-4a-gigabit-v2=y" >> .config

          # 核心策略：编译全量内核模块
          echo "CONFIG_ALL_KMODS=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-ppp=y" >> .config
          echo "CONFIG_PACKAGE_xl2tpd=y" >> .config
          echo "CONFIG_PACKAGE_ppp-mod-pppol2tp=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=24" >> .config

          make defconfig

      - name: Download Packages
        run: make download -j8

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Organize and Compress Assets
        run: |
          mkdir -p ./final_assets/
          mkdir -p ./all_kmods/
          
          # 1. 移动固件
          find bin/targets/ -name "*sysupgrade.bin" -exec cp {} ./final_assets/ \;
          
          # 2. 将所有 kmod 包打包成一个压缩包，避免 403 错误
          find bin/ -name "kmod-*.ipk" -exec cp {} ./all_kmods/ \;
          tar -zcvf ./final_assets/All_Kmods_Archive.tar.gz -C ./all_kmods .
          
          # 3. 提取 L2TP 关键包（单独列出方便下载）
          find bin/ -name "xl2tpd*.ipk" -exec cp {} ./final_assets/ \;
          find bin/ -name "ppp-mod-pppol2tp*.ipk" -exec cp {} ./final_assets/ \;

          echo "RELEASE_TAG=Mi4A-V2-32M-Final-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mi 4A V2 32M - Optimized Build
          body: |
            ## 变更说明
            - **All_Kmods_Archive.tar.gz**: 包含所有内核驱动，请下载后解压找到对应的 ipk。
            - **xl2tpd / ppp-mod-pppol2tp**: 已单独列出，方便 L2TP 用户直接下载。
            - 固件已集成 L2TP 支持和 32M 分区适配。
          files: ./final_assets/*
