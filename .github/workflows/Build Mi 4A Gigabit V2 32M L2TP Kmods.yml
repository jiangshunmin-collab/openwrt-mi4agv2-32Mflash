name: Build Mi 4A Gigabit V2 32M L2TP Kmods

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  FIRMWARE_VERSION: v24.10.2

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to Official Tag
        run: |
          git checkout tags/${{ env.FIRMWARE_VERSION }}
          echo "Checked out: $(git describe --tags)"

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3
          sudo timedatectl set-timezone "$TZ"

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch DTS for 32M Flash
        shell: python3 {0}
        run: |
          import os
          dts_path = "target/linux/ramips/dts/mt7621_xiaomi_mi-router-4a-gigabit-v2.dts"
          if not os.path.exists(dts_path):
              print(f"Error: {dts_path} not found!")
              exit(1)
          with open(dts_path, 'r') as f:
              content = f.read()
          content = content.replace("<0x0 0x1000000>", "<0x0 0x2000000>")
          override_node = """
          &partitions {
              partition@180000 {
                  label = "firmware";
                  reg = <0x180000 0x1e70000>;
              };
              partition@1ff0000 {
                  label = "Config";
                  reg = <0x1ff0000 0x10000>;
                  read-only;
              };
          };
          """
          with open(dts_path, 'w') as f:
              f.write(content + "\n" + override_node)

      - name: Configure Firmware
        run: |
          # 1. 基础硬件配置
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-4a-gigabit-v2=y" >> .config

          # 2. 关键：仅编译所有内核模块，不选所有应用
          echo "CONFIG_ALL_KMODS=y" >> .config
          
          # 3. 集成 LuCI 和 L2TP
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-ppp=y" >> .config
          echo "CONFIG_PACKAGE_xl2tpd=y" >> .config
          echo "CONFIG_PACKAGE_ppp-mod-pppol2tp=y" >> .config

          # 4. 扩容
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=24" >> .config

          make defconfig

      - name: Download Packages
        run: make download -j8

      - name: Compile Firmware
        run: |
          # 使用多核编译，如果报错则单核输出详细信息
          make -j$(nproc) || make -j1 V=s

      - name: Prepare Release Assets
        run: |
          mkdir -p ./release_files/
          
          # 1. 提取固件
          find bin/targets/ramips/mt7621/ -name "*sysupgrade.bin" -exec cp {} ./release_files/ \;
          
          # 2. 暴力搜索并提取所有 kmod 包 (核心修复)
          # 使用 -exec cp {} 确保不论路径多深都能抓取到
          find bin/targets/ramips/mt7621/kmods/ -name "kmod-*.ipk" -exec cp {} ./release_files/ \;
          
          # 3. 提取核心 L2TP 应用包
          find bin/packages/mipsel_24kc/ -name "xl2tpd*.ipk" -exec cp {} ./release_files/ \;
          find bin/packages/mipsel_24kc/ -name "ppp-mod-pppol2tp*.ipk" -exec cp {} ./release_files/ \;

          # 检查提取到了多少个文件 (调试用)
          echo "Total files to upload: $(ls ./release_files/ | wc -l)"
          echo "RELEASE_TAG=Mi4A-32M-FullKmods-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Create and Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.RELEASE_TAG }} \
            --title "Mi 4A Gigabit 32M - 完整驱动列表" \
            --notes "此列表包含所有 kmod 驱动。如果文件过多，请点击下方 Assets 展开。内核版本: 6.6.93"

          # 批量上传，使用通配符减少连接次数
          gh release upload ${{ env.RELEASE_TAG }} ./release_files/*.ipk ./release_files/*.bin --clobber
