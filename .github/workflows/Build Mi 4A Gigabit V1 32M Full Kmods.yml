name: Build Mi 4A Gigabit V1 32M Kmods

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  FIRMWARE_VERSION: v24.10.2

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to Official Tag
        run: |
          git checkout tags/${{ env.FIRMWARE_VERSION }}
          echo "Checked out: $(git describe --tags)"

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3
          sudo timedatectl set-timezone "$TZ"

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch DTS for 32M Flash (V1 Standard)
        shell: python3 {0}
        run: |
          import os
          # 明确指定 V1 (非 v2) 的 DTS 路径
          dts_path = "target/linux/ramips/dts/mt7621_xiaomi_mi-router-4a-gigabit.dts"
          if not os.path.exists(dts_path):
              print(f"Error: {dts_path} not found!")
              exit(1)
          with open(dts_path, 'r') as f:
              content = f.read()
          
          # 扩容 Flash 物理定义 (16M -> 32M)
          content = content.replace("<0x0 0x1000000>", "<0x0 0x2000000>")
          
          # 重新定义分区表，适配 32M 布局
          override_node = """
          &partitions {
              partition@180000 {
                  label = "firmware";
                  reg = <0x180000 0x1e70000>;
              };
              partition@1ff0000 {
                  label = "Config";
                  reg = <0x1ff0000 0x10000>;
                  read-only;
              };
          };
          """
          with open(dts_path, 'w') as f:
              f.write(content + "\n" + override_node)
          print("DTS for Mi 4A Gigabit V1 Patched.")

      - name: Configure Firmware
        run: |
          # 1. 硬件平台定义 (V1)
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-4a-gigabit=y" >> .config

          # 2. 启用全量内核模块编译 (用于解决 opkg 依赖问题)
          echo "CONFIG_ALL_KMODS=y" >> .config
          
          # 3. 集成 LuCI 中文界面与 L2TP 协议包
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-ppp=y" >> .config
          echo "CONFIG_PACKAGE_xl2tpd=y" >> .config
          echo "CONFIG_PACKAGE_ppp-mod-pppol2tp=y" >> .config
          echo "CONFIG_PACKAGE_kmod-pppol2tp=y" >> .config

          # 4. 扩容 Rootfs 空间
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=24" >> .config

          make defconfig

      - name: Download Packages
        run: make download -j8

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Organize and Compress Assets
        run: |
          mkdir -p ./final_assets/
          mkdir -p ./all_kmods/
          
          # 1. 提取固件
          find bin/targets/ -name "*sysupgrade.bin" -exec cp {} ./final_assets/ \;
          
          # 2. 归档全量内核驱动包，防止触发 GitHub 上传频率限制 (403 错误)
          find bin/ -name "kmod-*.ipk" -exec cp {} ./all_kmods/ \;
          tar -zcvf ./final_assets/All_Kmods_Archive.tar.gz -C ./all_kmods .
          
          # 3. 单独提取 L2TP 关键包，方便 Release 页面直接下载
          find bin/ -name "xl2tpd*.ipk" -exec cp {} ./final_assets/ \;
          find bin/ -name "ppp-mod-pppol2tp*.ipk" -exec cp {} ./final_assets/ \;
          
          echo "RELEASE_TAG=Mi4A-V1-32M-Final-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mi 4A Gigabit V1 (32M) - Optimized Build
          body: |
            ## 固件说明
            - **适配机型**: 小米路由器 4A 千兆版 (V1 / 非 v2)。
            - **闪存**: 已适配 32M 闪存扩容。
            - **功能**: 内置 LuCI 中文界面及 L2TP 拨号支持。
            
            ## 附件说明
            - **All_Kmods_Archive.tar.gz**: 包含此固件所有配套的内核驱动 ipk，解决 Vermagic 校验报错。
            - **xl2tpd / ppp-mod-pppol2tp**: L2TP 核心组件，已单独列出。
          files: ./final_assets/*
