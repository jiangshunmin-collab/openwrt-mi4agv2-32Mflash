name: Build Mi 4A Gigabit V1 32M Full Kmods

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  FIRMWARE_VERSION: v24.10.2

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to Official Tag
        run: |
          git checkout tags/${{ env.FIRMWARE_VERSION }}
          echo "Checked out: $(git describe --tags)"

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3
          sudo timedatectl set-timezone "$TZ"

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch DTS for 32M Flash (Standard Gigabit Model)
        shell: python3 {0}
        run: |
          import os
          # 注意：这里路径修改为非 v2 的路径
          dts_path = "target/linux/ramips/dts/mt7621_xiaomi_mi-router-4a-gigabit.dts"
          if not os.path.exists(dts_path):
              print(f"Error: {dts_path} not found!")
              exit(1)
          with open(dts_path, 'r') as f:
              content = f.read()
          
          # 扩容 Flash 范围从 16M (0x1000000) 到 32M (0x2000000)
          content = content.replace("<0x0 0x1000000>", "<0x0 0x2000000>")
          
          # 重新定义分区，让 firmware 占满大部分空间，留 64KB 给最后的 Config
          override_node = """
          &partitions {
              partition@180000 {
                  label = "firmware";
                  reg = <0x180000 0x1e70000>;
              };
              partition@1ff0000 {
                  label = "Config";
                  reg = <0x1ff0000 0x10000>;
                  read-only;
              };
          };
          """
          with open(dts_path, 'w') as f:
              f.write(content + "\n" + override_node)
          print("DTS for Mi 4A Gigabit (Standard) Patched.")

      - name: Configure Firmware
        run: |
          # 1. 基础硬件配置 (注意：这里去掉了 _v2)
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-4a-gigabit=y" >> .config

          # 2. 仅全选内核模块，不勾选全量应用 (避免 Rust/Go 编译失败)
          echo "CONFIG_ALL_KMODS=y" >> .config
          
          # 3. 集成 LuCI、中文包及 L2TP 核心
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-ppp=y" >> .config
          echo "CONFIG_PACKAGE_xl2tpd=y" >> .config
          echo "CONFIG_PACKAGE_ppp-mod-pppol2tp=y" >> .config

          # 4. 扩容 Rootfs 分区
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=24" >> .config

          make defconfig

      - name: Download Packages
        run: make download -j8

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Prepare Assets
        run: |
          mkdir -p ./release_files/
          # 提取 sysupgrade 固件
          find bin/targets/ramips/mt7621/ -name "*sysupgrade.bin" | xargs -i mv {} ./release_files/
          # 提取当前内核编译出的所有 kmod 插件
          find bin/targets/ramips/mt7621/kmods/ -name "*.ipk" | xargs -i cp {} ./release_files/
          # 提取 L2TP 相关应用插件
          find bin/packages/mipsel_24kc/ -name "xl2tpd*.ipk" | xargs -i cp {} ./release_files/
          find bin/packages/mipsel_24kc/ -name "ppp-mod-pppol2tp*.ipk" | xargs -i cp {} ./release_files/
          
          echo "RELEASE_TAG=Mi4A-Gigabit-32M-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.RELEASE_TAG }} \
            --title "Mi 4A Gigabit (Non-V2) 32M - Full Kmods" \
            --notes "固件已集成 L2TP。下方列表提供所有与此内核 100% 兼容的驱动包。"
          
          for file in ./release_files/*; do
            if [ -f "$file" ]; then
              gh release upload ${{ env.RELEASE_TAG }} "$file" --clobber
            fi
          done
