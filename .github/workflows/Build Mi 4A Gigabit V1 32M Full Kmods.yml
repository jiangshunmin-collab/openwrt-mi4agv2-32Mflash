name: Build Mi 4A Gigabit V1 32M Kmods
on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  FIRMWARE_VERSION: v24.10.2

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to Official Tag
        run: |
          git checkout tags/${{ env.FIRMWARE_VERSION }}
          echo "Checked out: $(git describe --tags)"

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3
          sudo timedatectl set-timezone "$TZ"

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch DTS for 32M Flash
        shell: python3 {0}
        run: |
          import os
          # 适配原版 (非v2) 路径，如需v2请自行修改文件名
          dts_path = "target/linux/ramips/dts/mt7621_xiaomi_mi-router-4a-gigabit.dts"
          if not os.path.exists(dts_path):
              print(f"Error: {dts_path} not found!")
              exit(1)
          with open(dts_path, 'r') as f:
              content = f.read()
          content = content.replace("<0x0 0x1000000>", "<0x0 0x2000000>")
          override_node = """
          &partitions {
              partition@180000 {
                  label = "firmware";
                  reg = <0x180000 0x1e70000>;
              };
              partition@1ff0000 {
                  label = "Config";
                  reg = <0x1ff0000 0x10000>;
                  read-only;
              };
          };
          """
          with open(dts_path, 'w') as f:
              f.write(content + "\n" + override_node)

      - name: Configure Firmware
        run: |
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-4a-gigabit=y" >> .config

          # 仅编译内核级包，避开大型应用
          echo "CONFIG_ALL_KMODS=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-ppp=y" >> .config
          echo "CONFIG_PACKAGE_xl2tpd=y" >> .config
          echo "CONFIG_PACKAGE_ppp-mod-pppol2tp=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=24" >> .config

          make defconfig

      - name: Download Packages
        run: make download -j8

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Prepare Assets
        run: |
          mkdir -p ./release_files/
          
          # 1. 查找并移动 sysupgrade 固件
          find bin/targets/ -name "*sysupgrade.bin" -exec cp {} ./release_files/ \;
          
          # 2. 核心修复：从 bin 根目录开始搜索所有 kmod 包，解决路径不存在的报错
          # 只提取 kmod 开头的文件，排除冗余
          find bin/ -name "kmod-*.ipk" -exec cp {} ./release_files/ \;
          
          # 3. 提取 L2TP 相关应用包
          find bin/ -name "xl2tpd*.ipk" -exec cp {} ./release_files/ \;
          find bin/ -name "ppp-mod-pppol2tp*.ipk" -exec cp {} ./release_files/ \;

          echo "RELEASE_TAG=Mi4A-FullKmods-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.RELEASE_TAG }} \
            --title "Mi 4A Gigabit 32M - Full Directory" \
            --notes "已内置 L2TP。下方是 100% 兼容的内核驱动包，由于文件较多，可能需要展开 Assets 列表查看。"
          
          # 批量上传，避免循环中的小错误中断进程
          gh release upload ${{ env.RELEASE_TAG }} ./release_files/*.ipk ./release_files/*.bin --clobber
