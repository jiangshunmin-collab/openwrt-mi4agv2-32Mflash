name: Build OpenWrt (Mi 4A Gigabit v2 - 32M Flash)
on:
  workflow_dispatch:  # 仅保留手动触发，缩进合规，无干扰注释

env:
  TZ: Asia/Shanghai
  UPLOAD_FIRMWARE: true
  FIRMWARE_VERSION: v24.10.2  
  FIRMWARE_NOTE: 专为小米4a千兆V2定制32M flash版本，芯片型号：MX25L25645GM2I-10G；刷机方法：参考https://www.right.com.cn/forum/thread-8436296-1-1.html，刷机命令改为：breed> flash erase 0x180000 0x1E70000；breed> flash write 0x180000 0x80001000 0x750251。

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 步骤1：拉取仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤2：切换到v24.10.2正式版标签
      - name: Switch to OpenWrt v24.10.2 Official Tag
        run: |
          git fetch --tags
          git checkout tags/v24.10.2 -b v24.10.2

      # 步骤3：初始化编译环境（安装依赖工具）
      - name: Initialize Compilation Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          df -h

      # 步骤4：更新并安装feeds（使用官方源，稳定性更高，避免镜像适配问题）
      - name: Update & Install OpenWrt Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 步骤5：配置固件（精准适配32M Flash，无冗余代码，格式合规）
      - name: Configure Firmware (Official Default + 32M Flash)
        run: |
          # 第一步：加载内核6.6的官方默认配置
          cat target/linux/ramips/mt7621/config-6.6 > .config

          # 第二步：强制指定小米4A千兆版V2设备
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-4a-gigabit-v2=y" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=n" >> .config

          # 第三步：适配32M Flash（精准修改DTS分区表+扩容根文件系统）
          ## 3.1 定义DTS文件路径并备份
          DTS_FILE="target/linux/ramips/dts/mt7621_xiaomi_mi-router-4a-gigabit-v2.dts"
          cp $DTS_FILE ${DTS_FILE}.bak
          ## 3.2 精准修改overlay分区（23M=0x1700000，缩进合规无格式错误）
          sed -i '/partition@180000 {/,/};/ s/size = <0x[^>]*>;//g' $DTS_FILE
          sed -i '/partition@180000 {/a \t\t\tsize = <0x1700000>;\n\t\t\tlabel = "overlay";' $DTS_FILE
          ## 3.3 扩容根文件系统，兼容squashfs格式
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=23" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config

          # 第四步：内置Luci和简体中文包（无需手动安装，官方标准配置）
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config

          # 第五步：生成最终配置（自动解决依赖冲突，无交互式命令，适配无终端环境）
          make defconfig

      # 步骤6：下载所需软件包（提前缓存，加快编译速度）
      - name: Download Required Packages
        run: make download -j8

      # 步骤7：开始编译固件（单线程，稳定优先，适配GitHub Actions资源限制）
      - name: Compile OpenWrt Firmware
        run: |
          echo -e "1 thread compile started (Stable for GitHub Actions)"
          make -j1 V=s

      # 步骤8：整理固件文件（定位固件输出目录）
      - name: Organize Firmware Files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          FIRMWARE_DIR="bin/targets/ramips/mt7621"
          if [ -d "$FIRMWARE_DIR" ]; then
            echo "FIRMWARE=$PWD/$FIRMWARE_DIR" >> $GITHUB_ENV
            echo "Firmware directory found: $PWD/$FIRMWARE_DIR"
          else
            echo "Firmware directory not found" && exit 1
          fi

      # 步骤9：上传固件到Artifacts（临时存储，方便下载）
      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        with:
          name: OpenWrt_Firmware_${{ env.FIRMWARE_VERSION }}_Mi4A_Gigabit
          path: ${{ env.FIRMWARE }}

      # 步骤10：上传固件到Releases（永久存储，方便归档）
      - name: Upload Firmware to Releases
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.FIRMWARE_VERSION }}
          name: ${{ env.FIRMWARE_VERSION }} - ${{ env.FIRMWARE_NOTE }}
          body: |
            ## 固件信息
            - 版本：${{ env.FIRMWARE_VERSION }}
            - 设备：小米4A千兆版V2
            - 适配：32M Flash（rootfs_data扩容至23MB）
            - 内置：官方完整Luci + 中文语言包 + 默认bootstrap主题
            - 刷机：推荐telnet命令刷机，需根据固件实际大小调整刷机命令
          files: ${{ env.FIRMWARE }}/*
          draft: false
          prerelease: false
